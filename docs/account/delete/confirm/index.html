<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm Account Deletion</title>
    <meta name="robots" content="noindex" />
    <style>
        :root {
            color-scheme: dark;
            --bg: #08080f;
            --panel: #11111a;
            --border: #2a2a3d;
            --text: #f2f4ff;
            --muted: #a4aac7;
            --accent: #8c7bff;
            --danger: #ff6b6b;
            --success: #2dd4bf;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #181828 0, var(--bg) 60%);
            color: var(--text);
        }
        main {
            max-width: 780px;
            margin: 0 auto;
            padding: 48px 20px 64px;
        }
        .card {
            background: rgba(17, 17, 26, 0.95);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
        }
        h1 { margin-top: 0; }
        p { color: var(--muted); line-height: 1.6; }
        .status {
            margin: 20px 0;
            padding: 16px;
            border-radius: 14px;
            background: #161622;
            border: 1px solid var(--border);
        }
        .success { color: var(--success); }
        .error { color: var(--danger); }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            border-radius: 999px;
            border: 0;
            background: linear-gradient(135deg, var(--accent), #5fb7ff);
            color: #07111d;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            margin-left: 10px;
        }
        code { color: #dbe4ff; word-break: break-all; }
        a { color: #b9c3ff; }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <h1>Confirm Account Deletion</h1>
            <p>This page completes the secure deletion flow. It accepts the one-time token from the email link and sends it to the API for verification.</p>

            <div id="status" class="status">Loading token...</div>

            <button id="confirmBtn" class="button" type="button" style="display:none;">Confirm Deletion</button>
            <a class="button secondary" href="/account/delete/">Back to deletion page</a>

            <p style="margin-top:20px;">
                Support: <a href="mailto:privacy@resetdopa.com">privacy@resetdopa.com</a>
            </p>
        </div>
    </main>

    <script>
        (function () {
            const statusEl = document.getElementById('status');
            const confirmBtn = document.getElementById('confirmBtn');
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const apiBase = window.RESETDOPA_DELETE_API_BASE || '';

            if (!token) {
                statusEl.innerHTML = '<span class="error">Missing token.</span> Open the confirmation link from your email again.';
                return;
            }

            statusEl.innerHTML = 'Token received. You can confirm now or wait for auto-confirm.';
            confirmBtn.style.display = 'inline-flex';

            async function confirmDeletion() {
                statusEl.textContent = 'Confirming deletion...';
                confirmBtn.disabled = true;
                try {
                    const response = await fetch(`${apiBase}/api/account/delete-confirm`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token })
                    });

                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(payload.error || 'Deletion could not be confirmed.');
                    }

                    statusEl.innerHTML = `<span class="success">${payload.status || 'completed'}</span> — Reference ID: <code>${payload.referenceId || 'n/a'}</code>`;
                    confirmBtn.style.display = 'none';
                } catch (error) {
                    statusEl.innerHTML = `<span class="error">${error.message || 'Unable to confirm deletion.'}</span>`;
                    confirmBtn.disabled = false;
                }
            }

            confirmBtn.addEventListener('click', confirmDeletion);
            confirmDeletion();
        })();
    </script>
</body>
</html>
